---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/raduburz/laravel
    - export PHP=/opt/cpanel/ea-php83/root/usr/bin/php
    - /bin/mkdir -p "$DEPLOYPATH"
    - test -f "$DEPLOYPATH/.env" || { echo "Create the production .env at $DEPLOYPATH/.env before deploying."; exit 1; }
    - /bin/tar --exclude='./.git' --exclude='./.env' --exclude='./vendor' --exclude='./node_modules' --exclude='./storage' -cf - . | /bin/tar -xf - -C "$DEPLOYPATH"
    - test -d "$DEPLOYPATH/storage" || /bin/cp -R storage "$DEPLOYPATH"/
    - /bin/mkdir -p "$DEPLOYPATH/bootstrap/cache"
    - cd "$DEPLOYPATH" && $PHP artisan config:clear